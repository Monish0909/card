<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Maroon Envelope Gradients -->
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a101e" />
      <stop offset="60%" stop-color="#3c0913" />
      <stop offset="100%" stop-color="#2a050c" />
    </linearGradient>

    <linearGradient id="flapGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6e1424" />
      <stop offset="100%" stop-color="#450a15" />
    </linearGradient>

    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae29c" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8f6b1e" />
    </linearGradient>

    <radialGradient id="goldSeal" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffeaad" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="80%" stop-color="#9a7322" />
      <stop offset="100%" stop-color="#694d13" />
    </radialGradient>

    <filter id="envelopeShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="sealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Envelope Body -->
  <g filter="url(#envelopeShadow)">
    <!-- Base rectangle -->
    <rect x="80" y="160" width="640" height="480" rx="18" fill="url(#maroonGrad)" stroke="url(#goldBorderGrad)" stroke-width="3" />
    
    <!-- Inside fold lines -->
    <path d="M 80 640 L 400 400 L 720 640" fill="#32060e" stroke="url(#goldBorderGrad)" stroke-width="1.5" opacity="0.6" />
    <path d="M 80 160 L 400 400 L 80 640 Z" fill="#440a15" opacity="0.5" />
    <path d="M 720 160 L 400 400 L 720 640 Z" fill="#3c0913" opacity="0.5" />

    <!-- Top Flap (Closed look) -->
    <path d="M 80 160 L 400 420 L 720 160 Z" fill="url(#flapGrad)" stroke="url(#goldBorderGrad)" stroke-width="2.5" />

    <!-- Royal Wax Seal / Gold Medallion with initials -->
    <g filter="url(#sealGlow)">
      <circle cx="400" cy="420" r="62" fill="url(#goldSeal)" stroke="#ffe8a3" stroke-width="2.5" />
      <circle cx="400" cy="420" r="54" fill="none" stroke="#7a5513" stroke-width="2" stroke-dasharray="4 3" opacity="0.8" />
      <!-- Monogram A & V -->
      <text x="400" y="428" font-family="'Dancing Script', cursive, serif" font-size="34" font-weight="bold" fill="#3c0913" text-anchor="middle" letter-spacing="1">A &amp; V</text>
    </g>

    <!-- Golden hashtag on envelope lower corner -->
    <text x="400" y="585" font-family="'Marcellus SC', serif, sans-serif" font-size="16" letter-spacing="4" fill="url(#goldBorderGrad)" text-anchor="middle" opacity="0.9">#AANYAVEERFOREVER</text>
  </g>
</svg>
