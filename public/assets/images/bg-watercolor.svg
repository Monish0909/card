<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <!-- Soft blush watercolor gradients -->
    <radialGradient id="blushWash" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff8f7" />
      <stop offset="45%" stop-color="#faecea" />
      <stop offset="85%" stop-color="#f5e1de" />
      <stop offset="100%" stop-color="#ebd2ce" />
    </radialGradient>
    
    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb75c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#aa7c1e" stop-opacity="0.15" />
    </linearGradient>

    <!-- Floral wash filter -->
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1080" height="1920" fill="url(#blushWash)" />

  <!-- Watercolor organic color blooms in corners -->
  <circle cx="100" cy="150" r="280" fill="#fcdad7" opacity="0.6" filter="url(#softBlur)" />
  <circle cx="980" cy="200" r="320" fill="#f8c8c4" opacity="0.5" filter="url(#softBlur)" />
  <circle cx="950" cy="1750" r="340" fill="#fcdad7" opacity="0.6" filter="url(#softBlur)" />
  <circle cx="120" cy="1800" r="300" fill="#f9cfcb" opacity="0.5" filter="url(#softBlur)" />
  <circle cx="540" cy="960" r="400" fill="#fffaf9" opacity="0.7" filter="url(#softBlur)" />

  <!-- Elegant corner floral ornamental motifs -->
  <!-- Top Left -->
  <g transform="translate(40, 40)" stroke="#c59f49" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 0 0 L 120 0 C 80 40 40 80 0 120 Z" fill="#fae8e6" />
    <path d="M 0 0 C 60 10 110 60 120 120" />
    <circle cx="45" cy="45" r="14" fill="#f4c2be" opacity="0.6" />
    <circle cx="90" cy="25" r="8" fill="#d9ad4b" opacity="0.4" />
    <circle cx="25" cy="90" r="8" fill="#d9ad4b" opacity="0.4" />
  </g>

  <!-- Top Right -->
  <g transform="translate(1040, 40) scale(-1, 1)" stroke="#c59f49" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 0 0 L 120 0 C 80 40 40 80 0 120 Z" fill="#fae8e6" />
    <path d="M 0 0 C 60 10 110 60 120 120" />
    <circle cx="45" cy="45" r="14" fill="#f4c2be" opacity="0.6" />
    <circle cx="90" cy="25" r="8" fill="#d9ad4b" opacity="0.4" />
    <circle cx="25" cy="90" r="8" fill="#d9ad4b" opacity="0.4" />
  </g>

  <!-- Bottom Left -->
  <g transform="translate(40, 1880) scale(1, -1)" stroke="#c59f49" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 0 0 L 120 0 C 80 40 40 80 0 120 Z" fill="#fae8e6" />
    <path d="M 0 0 C 60 10 110 60 120 120" />
    <circle cx="45" cy="45" r="14" fill="#f4c2be" opacity="0.6" />
    <circle cx="90" cy="25" r="8" fill="#d9ad4b" opacity="0.4" />
    <circle cx="25" cy="90" r="8" fill="#d9ad4b" opacity="0.4" />
  </g>

  <!-- Bottom Right -->
  <g transform="translate(1040, 1880) scale(-1, -1)" stroke="#c59f49" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 0 0 L 120 0 C 80 40 40 80 0 120 Z" fill="#fae8e6" />
    <path d="M 0 0 C 60 10 110 60 120 120" />
    <circle cx="45" cy="45" r="14" fill="#f4c2be" opacity="0.6" />
    <circle cx="90" cy="25" r="8" fill="#d9ad4b" opacity="0.4" />
    <circle cx="25" cy="90" r="8" fill="#d9ad4b" opacity="0.4" />
  </g>

  <!-- Delicate inner gold borderline -->
  <rect x="28" y="28" width="1024" height="1864" rx="16" fill="none" stroke="url(#goldFiligree)" stroke-width="1.5" />
</svg>
