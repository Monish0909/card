<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMehendi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldMehendi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <rect width="800" height="1000" rx="28" fill="url(#bgMehendi)" />
  <rect x="24" y="24" width="752" height="952" rx="20" fill="none" stroke="url(#goldMehendi)" stroke-width="1.5" opacity="0.5" />
  <circle cx="400" cy="340" r="140" fill="#047857" stroke="url(#goldMehendi)" stroke-width="2.5" />
  <!-- Henna / Mandala Motif -->
  <g transform="translate(400, 340)" stroke="url(#goldMehendi)" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="30" fill="#ca8a04" opacity="0.3" />
    <circle cx="0" cy="0" r="60" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="95" />
    <!-- Petals -->
    <path d="M 0 -95 C 20 -70 20 -40 0 0 C -20 -40 -20 -70 0 -95 Z" fill="#ca8a04" opacity="0.5" />
    <path d="M 0 95 C 20 70 20 40 0 0 C -20 40 -20 70 0 95 Z" fill="#ca8a04" opacity="0.5" />
    <path d="M -95 0 C -70 20 -40 20 0 0 C -40 -20 -70 -20 -95 0 Z" fill="#ca8a04" opacity="0.5" />
    <path d="M 95 0 C 70 20 40 20 0 0 C 40 -20 70 -20 95 0 Z" fill="#ca8a04" opacity="0.5" />
  </g>
  <text x="400" y="560" font-family="'Marcellus SC', serif" font-size="28" letter-spacing="4" fill="url(#goldMehendi)" text-anchor="middle">MEHENDI &amp; SANGEET</text>
  <text x="400" y="610" font-family="'Dancing Script', cursive" font-size="34" fill="#a7f3d0" text-anchor="middle">Royal Festive &amp; Jewel Tones</text>
  <text x="400" y="680" font-family="sans-serif" font-size="18" fill="#d1fae5" text-anchor="middle">Theme: Emerald Greens, Teals &amp; Bright Fuchsia</text>
  <text x="400" y="720" font-family="sans-serif" font-size="18" fill="#d1fae5" text-anchor="middle">Mirror work lehengas &amp; Bandhani kurtas</text>
  <g transform="translate(250, 780)">
    <circle cx="40" cy="40" r="28" fill="#047857" stroke="#6ee7b7" stroke-width="2"/>
    <circle cx="120" cy="40" r="28" fill="#0e7490" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="200" cy="40" r="28" fill="#be185d" stroke="#f472b6" stroke-width="2"/>
    <circle cx="280" cy="40" r="28" fill="#eab308" stroke="#fef08a" stroke-width="2"/>
  </g>
</svg>
