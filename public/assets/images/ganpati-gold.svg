<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2" />
      <stop offset="25%" stop-color="#e5b742" />
      <stop offset="50%" stop-color="#cf9937" />
      <stop offset="75%" stop-color="#a4751d" />
      <stop offset="100%" stop-color="#f5e08b" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a4751d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Stylized Elegant Traditional Ganesha Icon -->
  <g filter="url(#goldGlow)" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tilak / Aura Crescent -->
    <path d="M 250 80 Q 230 115 250 145 Q 270 115 250 80 Z" fill="url(#goldGrad)" stroke-width="2" />
    <circle cx="250" cy="120" r="7" fill="#4a0d18" stroke="none" />
    <path d="M 215 110 Q 250 125 285 110" stroke-width="8" />

    <!-- Left Ear / Head curve -->
    <path d="M 230 160 C 150 150 130 250 200 270" />
    
    <!-- Trunk trunk curve forming Om/Ganesha contour -->
    <path d="M 250 160 C 290 160 320 190 310 240 C 300 290 270 330 255 370 C 245 400 270 420 295 400 C 315 380 305 340 275 350" />
    
    <!-- Right Ear / Crown contour -->
    <path d="M 270 160 C 350 150 370 240 310 270" />
    
    <!-- Modak / Blessing symbol -->
    <ellipse cx="190" cy="305" rx="16" ry="20" fill="url(#goldGrad)" stroke-width="3" />
    <circle cx="190" cy="275" r="5" fill="url(#goldGrad)" />
  </g>
</svg>
